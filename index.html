  function contractTemplate(c){
    const pr=db.provider||contractProviderDefaults;
    return `CONTRATO DE PRESTAÇÃO DE SERVIÇOS DE FISIOTERAPIA\n\nCONTRATANTE: ${c.clientName||'[NOME]'}, CPF ${c.clientCpf||'[CPF]'}, residente e domiciliado(a) em ${c.clientAddress||'[ENDEREÇO]'}.\n\nCONTRATADA: ${pr.name}, fisioterapeuta, ${pr.crefito}, RG ${pr.rg}, CPF ${pr.cpf}, residente e domiciliada em ${pr.address}.\n\nAs partes acima identificadas têm, entre si, justo e acertado o presente Contrato de Prestação de Serviços de Fisioterapia, que se regerá pelas cláusulas seguintes e pelas condições de preço, forma e termo de pagamento descritas no presente.\n\nDO OBJETO DO CONTRATO\nCláusula 1ª. É objeto do presente contrato a prestação dos serviços de Fisioterapia ao CONTRATANTE.\n\nDO SERVIÇO DE FISIOTERAPIA\nCláusula 2ª. O serviço será prestado nos dias, endereço e horários combinados na cidade de Limeira/SP. Caso qualquer das partes não possa comparecer, deverá desmarcar com antecedência mínima de 1 (uma) hora. Em caso de falta do CONTRATANTE sem aviso, será devido o valor da sessão vigente.\nParágrafo único. A duração dos atendimentos é de aproximadamente 45 minutos, podendo variar conforme a necessidade do paciente.\n\nCláusula 3ª. O serviço abrangerá avaliação fisioterapêutica, definição de condutas e acompanhamento funcional, podendo ser solicitados exames quando necessários. O custeio desses exames não integra este contrato.\n\nCláusula 4ª. Nova avaliação e diagnóstico poderão ser realizados a cada 3 (três) meses ou sempre que necessário, com possibilidade de alteração da conduta conforme os achados.\n\nCláusula 5ª. Os serviços poderão ser realizados pela CONTRATADA e/ou por fisioterapeutas colaboradoras devidamente habilitadas e registradas no CREFITO, sob supervisão e responsabilidade da CONTRATADA.\n\nOBRIGAÇÕES DO CONTRATANTE\nO CONTRATANTE deverá seguir as orientações profissionais, disponibilizar condições adequadas para realização do atendimento e, quando indicado, contar com acompanhante familiar e/ou cuidador(a) durante a sessão.\n\nOBRIGAÇÕES DA CONTRATADA\nA CONTRATADA deverá prestar os serviços conforme as necessidades identificadas, utilizando técnicas compatíveis com as normas profissionais, acompanhando a execução dos exercícios e mantendo registro das condutas realizadas.\n\nDO PREÇO E DAS CONDIÇÕES DE PAGAMENTO\nO serviço será remunerado pela quantia de ${money(c.sessionValue||0)} por atendimento, por meio e vencimento combinados entre as partes.\n\nDO INADIMPLEMENTO\nEm caso de inadimplemento, poderão incidir multa de 2%, juros de mora de 1% ao mês e correção monetária, sem prejuízo da suspensão dos serviços quando a inadimplência superar 30 dias.\n\nDA RESCISÃO\nO contrato poderá ser rescindido por qualquer das partes mediante comunicação formal por escrito, preferencialmente com antecedência de 1 (uma) semana da próxima sessão agendada.\n\nDAS CONDIÇÕES GERAIS\nAlterações relevantes deverão ser registradas por escrito. A duração deste contrato será de 12 (doze) meses, podendo ser prorrogada mediante acordo entre as partes.\n\nDO FORO\nPara dirimir controvérsias oriundas deste contrato, fica eleito o foro da comarca de Limeira, Estado de São Paulo, observadas as regras legais aplicáveis.\n\nTERMO DE CONSENTIMENTO ESCLARECIDO\nO CONTRATANTE declara ter recebido explicações sobre o estado de saúde funcional, objetivos, benefícios, riscos, possíveis intercorrências e alternativas relacionadas ao tratamento fisioterapêutico, concordando com o plano de cuidado proposto e podendo esclarecer dúvidas a qualquer momento.\n\nTERMO DE USO DE IMAGEM\nO uso de imagem, voz, fotos, vídeos e imagens de exames para finalidade didática, científica ou de divulgação somente ocorrerá mediante autorização específica do CONTRATANTE ou responsável, podendo tal autorização ser revogada antes da publicação.\n\nLimeira/SP, ____ de __________________ de ______.`;
  }

    const f=document.getElementById('form');f.elements.patient.onchange=e=>{const p=patient(e.target.value);f.elements.clientName.value=p.name;f.elements.clientCpf.value=p.cpf||p.responsibleCpf||'';f.elements.clientAddress.value=p.address||'';f.elements.sessionValue.value=p.price||0};

  function bindSignatureCanvas(canvas){
    const ctx=canvas.getContext('2d');const resize=()=>{const r=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;canvas.width=r.width*ratio;canvas.height=r.height*ratio;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#173e37'};resize();let drawing=false;
    const point=e=>{const r=canvas.getBoundingClientRect(),t=e.touches?.[0]||e;return {x:t.clientX-r.left,y:t.clientY-r.top}};
    const start=e=>{e.preventDefault();drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};const move=e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();canvas.dataset.signed='1'};const end=e=>{drawing=false};
    canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',end);canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
  }
  window.clearSignature=function(which){const c=document.getElementById(which);if(!c)return;const ctx=c.getContext('2d');ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.restore();c.dataset.signed=''};
  window.signContract=function(cid){
    const c=db.contracts.find(x=>x.id===cid);if(!c)return;if(c.status==='Assinado')return toast('Este contrato já está assinado.');
    modal('Assinar contrato',`<p class="note">Assine nos dois campos abaixo. O contrato será bloqueado após a confirmação e ficará disponível para gerar PDF.</p><div class="signature-grid"><div class="signature-box"><h4>Contratante — ${esc(c.clientName)}</h4><canvas id="client-sign"></canvas><button type="button" class="textbtn" onclick="clearSignature('client-sign')">Limpar</button></div><div class="signature-box"><h4>Contratada — ${esc((db.provider||contractProviderDefaults).name)}</h4><canvas id="provider-sign"></canvas><button type="button" class="textbtn" onclick="clearSignature('provider-sign')">Limpar</button></div></div>`,()=>{const a=document.getElementById('client-sign'),b=document.getElementById('provider-sign');if(a.dataset.signed!=='1'||b.dataset.signed!=='1')return toast('As duas assinaturas são necessárias.');c.clientSignature=a.toDataURL('image/png');c.providerSignature=b.toDataURL('image/png');c.status='Assinado';c.signedAt=new Date().toISOString();c.updated=c.signedAt;commit('Contrato assinado e bloqueado. Agora você pode gerar o PDF.')},'Concluir assinatura');
    setTimeout(()=>{bindSignatureCanvas(document.getElementById('client-sign'));bindSignatureCanvas(document.getElementById('provider-sign'))},40);
  };
  window.duplicateContract=function(cid){const src=db.contracts.find(x=>x.id===cid);if(!src)return;const c=deepCopy(src);c.id=id();c.status='Rascunho';c.created=new Date().toISOString();c.updated=c.created;delete c.clientSignature;delete c.providerSignature;delete c.signedAt;db.contracts.push(c);save();render();toast('Nova versão criada para edição.');};
  window.deleteContract=function(cid){const i=db.contracts.findIndex(x=>x.id===cid);if(i<0)return;if(db.contracts[i].status==='Assinado')return toast('Contrato assinado não pode ser excluído nesta versão.');if(confirm('Excluir este rascunho?')){db.contracts.splice(i,1);save();render();toast('Rascunho excluído.')}};
  window.printContractPDF=function(cid){const c=db.contracts.find(x=>x.id===cid);if(!c)return;const pr=db.provider||contractProviderDefaults;printWindow('Contrato de Prestação de Serviços de Fisioterapia',`<div class="contract-body">${esc(c.body||contractTemplate(c))}</div><div class="signature-print"><div>${c.clientSignature?`<img src="${c.clientSignature}">`:''}<b>${esc(c.clientName)}</b><br><span class="meta">Contratante · CPF ${esc(c.clientCpf)}</span></div><div>${c.providerSignature?`<img src="${c.providerSignature}">`:''}<b>${esc(pr.name)}</b><br><span class="meta">Contratada · ${esc(pr.crefito)}</span></div></div>${c.signedAt?`<p class="meta">Assinado no aplicativo em ${new Date(c.signedAt).toLocaleString('pt-BR')}.</p>`:''}`)};

  function contractDraftFromPatient(p){

      sessionValue:Number(p?.price||0),

      status:'Rascunho',
      templateVersion:V6_TEMPLATE_VERSION
    };
  }

  function migrateContractsV6(){

      if(c.patientCpf===undefined)c.patientCpf=p?.cpf||'';
      if(c.relationship===undefined)c.relationship='';
      if(c.contractDate===undefined)c.contractDate=(c.created||today).slice(0,10);
      if(c.templateVersion!==V6_TEMPLATE_VERSION && c.status!=='Assinado'){
        c.body=contractTemplate({...c,body:undefined});
        c.templateVersion=V6_TEMPLATE_VERSION;

        </div>
        <label class="wide v6-contract-text">Texto completo do contrato
          <textarea name="body" required>${esc(c.body)}</textarea>

      </div>`,
      data=>{
        const target=db.contracts.find(x=>x.id===c.id)||c;
        Object.assign(target,data,{
          sessionValue:Number(data.sessionValue),
          templateVersion:V6_TEMPLATE_VERSION,
          updated:new Date().toISOString()

          target.created=target.created||new Date().toISOString();

      syncContractText();

    );
    setTimeout(()=>{
      bindSignatureCanvas(document.getElementById('client-sign'));

  };


  function pdfNormalize(s){
    return String(s??'')
      .replace(/\r/g,'')
      .replace(/[“”]/g,'"')
      .replace(/[‘’]/g,"'")
      .replace(/[–—]/g,'-')
      .replace(/\u00a0/g,' ');
  }
  function pdfEscape(s){
    return pdfNormalize(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  }
  function latin1Bytes(s){
    s=pdfNormalize(s);
    const out=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++){
      const c=s.charCodeAt(i);
      out[i]=c<=255?c:63;
    }
    return out;
  }
  function concatBytes(parts){
    const len=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(len);
    let pos=0;for(const part of parts){out.set(part,pos);pos+=part.length}
    return out;
  }
  function base64Bytes(dataUrl){
    const b64=String(dataUrl||'').split(',')[1]||'',bin=atob(b64),out=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
    return out;
  }
  function jpegSize(bytes){
    let i=2;
    while(i+9<bytes.length){
      if(bytes[i]!==0xff){i++;continue}
      const marker=bytes[i+1];
      if([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(marker)){
        return {h:(bytes[i+5]<<8)+bytes[i+6],w:(bytes[i+7]<<8)+bytes[i+8]};
      }
      const len=(bytes[i+2]<<8)+bytes[i+3];
      if(!len)break;i+=2+len;
    }
    return {w:600,h:200};
  }
  async function ensureJpeg(dataUrl){
    if(!dataUrl)return '';
    if(/^data:image\/jpe?g/i.test(dataUrl))return dataUrl;
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement('canvas');
        cv.width=img.naturalWidth||600;cv.height=img.naturalHeight||200;
        const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0);
        resolve(cv.toDataURL('image/jpeg',0.92));
      };
      img.onerror=reject;img.src=dataUrl;
    });
  }
  function wrapPdfText(text,maxChars){
    const words=pdfNormalize(text).trim().split(/\s+/).filter(Boolean),lines=[];let line='';
    for(const word of words){
      if(!line){line=word;continue}
      if((line+' '+word).length<=maxChars)line+=' '+word;
      else{lines.push(line);line=word}
    }
    if(line)lines.push(line);
    return lines.length?lines:[''];
  }
  function headingLine(s){
    const t=String(s||'').trim();
    return t==='CONTRATO DE PRESTAÇÃO DE SERVIÇOS DE FISIOTERAPIA'
      || t==='DO OBJETO DO CONTRATO'
      || t==='DO SERVIÇO DE FISIOTERAPIA'
      || t==='OBRIGAÇÕES DO CONTRATANTE'
      || t==='OBRIGAÇÕES DO CONTRATADO'
      || t==='DO PREÇO E DAS CONDIÇÕES DE PAGAMENTO'
      || t==='DO INADIMPLEMENTO'
      || t==='DA RESCISÃO'
      || t==='DAS CONDIÇÕES GERAIS'
      || t==='DO FORO'
      || t==='TERMO DE CONSENTIMENTO ESCLARECIDO'
      || t==='TERMO DE USO DE IMAGEM';
  }
  function contractPdfLayout(c){
    const body=String(c.body||contractTemplate(c)).replace(/\r/g,'');
    const logical=body.split('\n'),pages=[];let cmds=[],y=784;

    function header(){
      return [
        '0.10 0.29 0.25 rg',
        `BT /F2 9 Tf 48 815 Td (${pdfEscape('OLHAN - FISIOTERAPIA DOMICILIAR ESPECIALIZADA')}) Tj ET`,
        '0.75 0.47 0.40 RG 48 805 m 547 805 l S',
        '0 0 0 rg'
      ].join('\n')+'\n';
    }
    function newPage(){if(cmds.length)pages.push(cmds.join(''));cmds=[header()];y=784}
    function need(h){if(y-h<58)newPage()}
    newPage();

    for(const raw of logical){
      const line=raw.trim();
      if(!line){need(8);y-=8;continue}
      if((line==='TERMO DE CONSENTIMENTO ESCLARECIDO'||line==='TERMO DE USO DE IMAGEM') && y<700)newPage();
      const isHead=headingLine(line),isTitle=line==='CONTRATO DE PRESTAÇÃO DE SERVIÇOS DE FISIOTERAPIA';
      const size=isTitle?13:isHead?10.5:9.2;
      const lh=isTitle?17:isHead?14:12;
      const max=isTitle?58:isHead?76:94;
      const lines=wrapPdfText(line,max);
      need(lines.length*lh+2);
      for(const txt of lines){
        const font=isHead?'/F2':'/F1';
        let x=48;
        if(isTitle)x=Math.max(48,297-(txt.length*size*0.23));
        cmds.push(`BT ${font} ${size} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td (${pdfEscape(txt)}) Tj ET\n`);
        y-=lh;
      }
      if(isHead)y-=2;
    }
    pages.push(cmds.join(''));
    return {pages,y};
  }

  function streamObject(dict,data){
    const prefix=latin1Bytes(`<< ${dict} /Length ${data.length} >>\nstream\n`);
    const suffix=latin1Bytes('\nendstream');
    return concatBytes([prefix,data,suffix]);
  }
  function objectBytes(num,content){
    const body=typeof content==='string'?latin1Bytes(content):content;
    return concatBytes([latin1Bytes(`${num} 0 obj\n`),body,latin1Bytes('\nendobj\n')]);
  }

  async function buildContractPdf(c){
    const pr=db.provider||contractProviderDefaults;
    const layout=contractPdfLayout(c);
    let clientJpeg='',providerJpeg='';
    try{
      clientJpeg=await ensureJpeg(c.clientSignature);
      providerJpeg=await ensureJpeg(c.providerSignature);
    }catch(e){}

    let pages=layout.pages.slice(),last=pages.length-1;
    const sigParts=[];
    if(clientJpeg||providerJpeg){
      sigParts.push('0.75 0.47 0.40 RG 48 190 m 547 190 l S\n0 0 0 rg\n');
      sigParts.push(`BT /F2 10 Tf 48 172 Td (${pdfEscape('ASSINATURAS')}) Tj ET\n`);
      if(clientJpeg)sigParts.push('q 190 0 0 58 48 96 cm /Im1 Do Q\n');
      if(providerJpeg)sigParts.push('q 190 0 0 58 307 96 cm /Im2 Do Q\n');
      sigParts.push(`BT /F2 8.5 Tf 48 84 Td (${pdfEscape(c.clientName||'Contratante')}) Tj ET\n`);
      sigParts.push(`BT /F1 7.5 Tf 48 72 Td (${pdfEscape('Contratante - CPF '+(c.clientCpf||''))}) Tj ET\n`);
      sigParts.push(`BT /F2 8.5 Tf 307 84 Td (${pdfEscape(pr.name)}) Tj ET\n`);
      sigParts.push(`BT /F1 7.5 Tf 307 72 Td (${pdfEscape('Contratada - '+pr.crefito)}) Tj ET\n`);
      if(c.signedAt)sigParts.push(`BT /F1 7 Tf 48 52 Td (${pdfEscape('Assinado no aplicativo em '+new Date(c.signedAt).toLocaleString('pt-BR'))}) Tj ET\n`);
      pages[last]+=sigParts.join('');
    }

    const imageDefs=[];
    if(clientJpeg){
      const b=base64Bytes(clientJpeg),s=jpegSize(b);imageDefs.push({name:'Im1',bytes:b,w:s.w,h:s.h});
    }
    if(providerJpeg){
      const b=base64Bytes(providerJpeg),s=jpegSize(b);imageDefs.push({name:'Im2',bytes:b,w:s.w,h:s.h});
    }

    let next=5;
    imageDefs.forEach(im=>im.obj=next++);
    const pageDefs=pages.map(()=>({contentObj:next++,pageObj:next++}));
    const maxObj=next-1,objects={};

    objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
    objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objects[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    imageDefs.forEach(im=>{
      objects[im.obj]=streamObject(
        `/Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`,
        im.bytes
      );
    });

    pageDefs.forEach((pd,i)=>{
      const footer=`BT /F1 7 Tf 48 27 Td (${pdfEscape('Olhan - Fisioterapia Domiciliar Especializada')}) Tj ET\nBT /F1 7 Tf 505 27 Td (${pdfEscape('Página '+(i+1)+'/'+pageDefs.length)}) Tj ET\n`;
      const content=latin1Bytes(pages[i]+footer);
      objects[pd.contentObj]=streamObject('',content);
      const xobj=i===pageDefs.length-1 && imageDefs.length
        ?` /XObject << ${imageDefs.map(im=>`/${im.name} ${im.obj} 0 R`).join(' ')} >>`
        :'';
      objects[pd.pageObj]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${xobj} >> /Contents ${pd.contentObj} 0 R >>`;
    });
    objects[2]=`<< /Type /Pages /Kids [${pageDefs.map(p=>p.pageObj+' 0 R').join(' ')}] /Count ${pageDefs.length} >>`;

    const chunks=[latin1Bytes('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')],offsets=Array(maxObj+1).fill(0);
    let total=chunks[0].length;
    for(let n=1;n<=maxObj;n++){
      offsets[n]=total;
      const ob=objectBytes(n,objects[n]);
      chunks.push(ob);total+=ob.length;
    }
    const xrefOffset=total;
    let xref=`xref\n0 ${maxObj+1}\n0000000000 65535 f \n`;
    for(let n=1;n<=maxObj;n++)xref+=String(offsets[n]).padStart(10,'0')+' 00000 n \n';
    xref+=`trailer\n<< /Size ${maxObj+1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
    chunks.push(latin1Bytes(xref));
    return concatBytes(chunks);
  }

  window.printContractPDF=async function(cid){
    const c=db.contracts.find(x=>x.id===cid);if(!c)return;
    if(c.status!=='Assinado')return toast('Assine o contrato antes de gerar o PDF final.');
    try{
      toast('Gerando PDF...');
      const bytes=await buildContractPdf(c);
      const safe=(c.patientName||c.clientName||'Paciente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_');
      download(`Contrato_Olhan_${safe}.pdf`,bytes,'application/pdf');
      toast('PDF gerado e baixado.');
    }catch(e){
      console.error(e);
      toast('Não foi possível gerar o PDF. Tente novamente.');
    }
  };


  window.duplicateContract=function(cid){
    const src=db.contracts.find(x=>x.id===cid);if(!src)return;
    const c=deepCopy(src);
    c.id=id();c.status='Rascunho';c.created=new Date().toISOString();c.updated=c.created;c.contractDate=today;c.templateVersion=V6_TEMPLATE_VERSION;
    delete c.clientSignature;delete c.providerSignature;delete c.signedAt;
    c.body=contractTemplate(c);
    db.contracts.push(c);save();render();toast('Nova versão criada com o modelo completo.');
  };

  window.contracts=function(){
    return head(
      'Contratos',
      'Modelo completo da Paula, assinatura no aplicativo e PDF final para download.',
      btn('Novo contrato','contractForm()','plus')
    )+
    `<div class="toolbar">
      <button class="btn secondary small" onclick="providerSettingsForm()">${ic('settings')} Dados da contratada</button>
      <span class="spacer"></span>
      <span class="tag">${db.contracts.length} contrato${db.contracts.length===1?'':'s'}</span>
    </div>
    <div class="v6-contract-info">
      <b>Modelo completo incorporado</b>
      <span>Contrato de prestação de serviços + Termo de Consentimento Esclarecido + Termo de Uso de Imagem.</span>
    </div>
    <div class="contract-grid">
      ${db.contracts.length
        ?db.contracts.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).map(c=>`
          <section class="card contract-card">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
              <div>
                <h3>${esc(c.patientName||patient(c.patient).name)}</h3>
                <p>Contratante: ${esc(c.clientName||'Não informado')} · ${money(c.sessionValue)}</p>
              </div>
              ${c.status==='Assinado'?'<span class="contract-signed">✓ Assinado</span>':tag('Rascunho')}
            </div>
            <div class="contract-meta">
              <span>CPF contratante: ${esc(c.clientCpf||'Não informado')}</span>
              <span>CPF paciente: ${esc(c.patientCpf||'Não informado')}</span>
              <span>${esc(c.clientAddress||'Endereço não informado')}</span>
              <span>Data do contrato: ${esc(longDatePT(c.contractDate||today))}</span>
              <span>${c.signedAt?'Assinado em '+new Date(c.signedAt).toLocaleString('pt-BR'):'Atualizado em '+new Date(c.updated||c.created).toLocaleString('pt-BR')}</span>
            </div>
            <div class="contract-actions">
              ${c.status==='Assinado'
                ?`${btn('Baixar PDF',`printContractPDF('${c.id}')`,'download','soft')}${btn('Nova versão',`duplicateContract('${c.id}')`,'file','secondary small')}`
                :`${btn('Editar',`contractForm('${c.id}')`,'settings','secondary small')}${btn('Assinar',`signContract('${c.id}')`,'signature','soft')}${btn('Excluir',`deleteContract('${c.id}')`,'close','secondary small')}`}
            </div>
          </section>`).join('')
        :'<div class="empty">Nenhum contrato. Crie o primeiro a partir do cadastro de um paciente.</div>'}
    </div>
    <p class="v5-setting-note" style="margin-top:18px">
      <b>PDF:</b> após as duas assinaturas, o botão “Baixar PDF” gera um arquivo PDF real diretamente no aplicativo, com o texto completo e as assinaturas incorporadas.
    </p>
    <p class="v5-setting-note">
      <b>Segurança:</b> esta versão HTML ainda armazena dados neste navegador. Para uso real com CPF, dados de saúde, documentos e assinaturas, a versão de produção deve usar autenticação, banco de dados e armazenamento protegido.
    </p>`;
  };

  const renderV5=render;
  render=function(){
    renderV5();
    const foot=document.querySelector('.foot');
    if(foot)foot.textContent='OLHAN · FISIOTERAPIA DOMICILIAR ESPECIALIZADA · V6';
  };

  downloadHtml=function(){
    download('Olhan_App_v7_Paula_CORRIGIDO.html','<!doctype html>\n'+document.documentElement.outerHTML,'text/html;charset=utf-8');
  };

  render();
})();

<script>
(function(){
 let drag=null,suppressClickUntil=0;
 const clear=()=>{if(!drag)return;drag.preview?.remove();drag.target?.classList.remove('touch-drop-target');drag.element.classList.remove('dragging');drag=null};
 document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  const el=e.target.closest('[data-appointment-id]');if(!el)return;
  const a=db.appointments.find(a=>a.id===el.dataset.appointmentId);if(!a)return;
  drag={element:el,id:a.id,x:e.clientX,y:e.clientY,pointer:e.pointerId,active:false};
 });
 document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pointer)return;
  if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<10)return;
  if(!drag.active){
   let prevented=false;startAppointmentDrag(drag.id,{preventDefault(){prevented=true},currentTarget:drag.element});
   if(prevented){suppressClickUntil=Date.now()+500;clear();return}
   drag.active=true;drag.preview=document.createElement('div');drag.preview.className='touch-drag-preview';drag.preview.textContent=patient(db.appointments.find(a=>a.id===drag.id).patient).name;document.body.append(drag.preview);
  }
  e.preventDefault();drag.preview.style.left=(e.clientX+12)+'px';drag.preview.style.top=(e.clientY+12)+'px';
  drag.target?.classList.remove('touch-drop-target');
  drag.target=document.elementsFromPoint(e.clientX,e.clientY).map(el=>el.closest('[data-drop-date]')).find(Boolean);
  drag.target?.classList.add('touch-drop-target');
 },{passive:false});
 document.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pointer)return;
  if(drag.active){suppressClickUntil=Date.now()+700;if(drag.target){const a=db.appointments.find(a=>a.id===drag.id);dropAppointment(drag.target.dataset.dropDate,drag.target.dataset.dropTime||a.time,{preventDefault(){}})}else{draggedAppointmentId=null;toast('Solte o atendimento sobre um dia ou horário da agenda.')}}
  clear();
 });
 document.addEventListener('pointercancel',()=>{draggedAppointmentId=null;clear()});
 document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
})();
</script>

  window.team=function(){return head('Nossa equipe','Profissionais que fazem o cuidado acontecer.',btn('Novo profissional','teamForm()'))+`<div class="grid3">${db.team.map(t=>`<section class="card patient"><div class="patient-top"><span class="avatar">${esc(initials(t.name))}</span><div><h3>${esc(t.name)}</h3><p>${esc(t.role||'Fisioterapeuta')}</p></div></div><div class="patient-info"><span>CREFITO: ${esc(t.crefito||'Não informado')}</span><span>E-mail: ${esc(t.email||'Não informado')}</span><span>Repasse: ${Number(t.repasse||0).toLocaleString('pt-BR')}%</span><span>${db.patients.filter(p=>p.pro===t.id).length} pacientes vinculados</span></div>${btn('Editar profissional',`teamForm('${t.id}')`,'users','secondary')}</section>`).join('')}</div><p class="note">CPF, RG, endereço e demais dados ficam disponíveis na edição do cadastro. Na versão de produção, dados pessoais devem ficar protegidos por autenticação e permissões.</p>`};

  // Ao arrastar um atendimento recorrente, escolher se muda só este ou a sequência futura.
  window.dropAppointment=function(date,time,ev){
    ev?.preventDefault();const aid=draggedAppointmentId||ev?.dataTransfer?.getData('text/plain');draggedAppointmentId=null;
    const a=db.appointments.find(x=>x.id===aid);if(!a)return;
    if(billed(a)||db.records.some(r=>r.appointment===aid&&!r.draft))return toast('Atendimento fechado ou com registro clínico não pode ser movido.');
    const oldDate=a.date,oldTime=a.time;
    const future=a.seriesId?db.appointments.filter(x=>x.seriesId===a.seriesId&&x.date>=oldDate&&!billed(x)&&!db.records.some(r=>r.appointment===x.id&&!r.draft)).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)):[];
    let changeSeries=false;
    if(future.length>1)changeSeries=confirm('Este atendimento faz parte de uma recorrência.\n\nOK = alterar este e todos os próximos até o fim do período.\nCancelar = alterar somente este atendimento.');
    const targets=changeSeries?future:[a];
    const dayDelta=Math.round((new Date(date+'T12:00:00')-new Date(oldDate+'T12:00:00'))/86400000);
    const tm=x=>Number(x.slice(0,2))*60+Number(x.slice(3)); const timeDelta=tm(time)-tm(oldTime);
    const moved=targets.map((x,i)=>{
      if(x.id===a.id)return {...x,date,time};
      const nd=add(x.date,dayDelta),mins=tm(x.time)+timeDelta;
      return {...x,date:nd,time:String(Math.floor(mins/60)).padStart(2,'0')+':'+String((mins%60+60)%60).padStart(2,'0')};
    });
    for(const m of moved){
      if(tm(m.time)<0||tm(m.time)+Number(m.duration)>1440)return toast('A alteração faria um atendimento ultrapassar o limite do dia.');
      const ignore=targets.map(x=>x.id);const conflict=db.appointments.some(x=>!ignore.includes(x.id)&&x.pro===m.pro&&x.date===m.date&&!x.status.includes('Cancelado')&&overlap(x.time,x.duration,m.time,m.duration));
      if(conflict)return toast(`Há conflito de horário em ${fmt(m.date)} às ${m.time}. Nenhuma alteração foi aplicada.`);
    }
    moved.forEach(m=>{const x=db.appointments.find(y=>y.id===m.id);x.history=x.history||[];x.history.push(`${new Date().toLocaleString('pt-BR')}: movido de ${x.date} ${x.time} para ${m.date} ${m.time}${changeSeries?' (recorrência futura)':''}`);x.date=m.date;x.time=m.time;x.status=x.status==='Agendado'?'Remarcado':x.status});
    save();render();toast(changeSeries?`${moved.length} atendimentos futuros foram atualizados.`:'Somente este atendimento foi atualizado.');
  };

  // Portal demonstrativo do paciente/familiar. Em produção, o login deve usar backend e autenticação real.
  window.openPatientPortal=function(pid){
    const p=patient(pid), recs=db.records.filter(r=>r.patient===pid&&!r.draft).sort((a,b)=>(b.date||'').localeCompare(a.date||'')), files=db.files.filter(f=>f.patient===pid), contracts=(db.contracts||[]).filter(c=>c.patient===pid), apps=db.appointments.filter(a=>a.patient===pid&&['Realizado','Cancelado com cobrança'].includes(a.status)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
    if(!p.portalPin)p.portalPin=String(Math.floor(100000+Math.random()*900000));p.portalEnabled=true;save();
    modal('Acesso do paciente / familiar',`<div class="formgrid"><div class="wide note"><b>Portal demonstrativo de ${esc(p.name)}</b><br>PIN provisório: <b style="font-size:18px">${esc(p.portalPin)}</b><br><small>Na versão online, o acesso será individual, autenticado e protegido.</small></div></div>
      <div class="segments" style="margin:18px 0"><button class="selected">Resumo do portal</button></div>
      <section class="card" style="margin-bottom:14px"><div class="cardhead"><div><h2>Histórico de atendimentos</h2><p>O que foi realizado e registrado para compartilhamento.</p></div><span class="tag">${apps.length}</span></div>${apps.slice(0,12).map(a=>`<div class="record"><h3>${fmt(a.date)} · ${esc(a.service)}</h3><p>${esc(a.status)} · ${esc(professional(a.pro))}</p></div>`).join('')||'<div class="empty">Nenhum atendimento concluído.</div>'}</section>
      <section class="card" style="margin-bottom:14px"><div class="cardhead"><div><h2>Evoluções liberadas</h2><p>Atualizadas a partir do prontuário.</p></div><span class="tag">${recs.length}</span></div>${recs.slice(0,10).map(r=>`<div class="record"><h3>${fmt(r.date)} · ${esc(r.type)}</h3><p>${esc(r.general||r.conduct||'Registro clínico realizado.')}</p></div>`).join('')||'<div class="empty">Nenhuma evolução concluída.</div>'}</section>
      <section class="card" style="margin-bottom:14px"><div class="cardhead"><div><h2>Contratos</h2><p>Documentos vinculados ao paciente.</p></div><span class="tag">${contracts.length}</span></div>${contracts.map(c=>`<div class="record"><h3>${esc(c.status||'Rascunho')} · ${esc(c.clientName||p.name)}</h3><p>${c.signedAt?'Assinado em '+new Date(c.signedAt).toLocaleDateString('pt-BR'):'Contrato disponível no sistema'}</p></div>`).join('')||'<div class="empty">Nenhum contrato vinculado.</div>'}</section>
      <section class="card"><div class="cardhead"><div><h2>Fotos, vídeos e documentos</h2><p>Registros anexados ao prontuário.</p></div><span class="tag">${files.length}</span></div>${files.map(f=>`<div class="record"><a href="${f.data}" download="${esc(f.name)}">${esc(f.name)}</a> <small>· ${fmt(f.date)}</small></div>`).join('')||'<div class="empty">Nenhum arquivo anexado.</div>'}</section>`,null);
  };
  const previousDetail=window.detail;
  window.detail=function(){let html=previousDetail();const p=patient(patientId);return `<div style="display:flex;justify-content:flex-end;margin-bottom:12px">${btn('Acesso do paciente / familiar',`openPatientPortal('${p.id}')`,'users','secondary')}</div>`+html};

  // Atualiza o render para usar as versões V8 das telas sobrescritas.
  window.render=function(){document.getElementById('nav').innerHTML=navs.map(n=>`<button class="${view===n[0]?'active':''}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join('');document.getElementById('crumb').textContent=navs.find(n=>n[0]===view)?.[1];document.getElementById('menubtn').innerHTML=ic('menu');document.getElementById('app').innerHTML=(patientId?detail():view==='home'?home():view==='agenda'?agenda():['patients','records'].includes(view)?patients():view==='evaluations'?evaluations():view==='finance'?finance():view==='team'?team():view==='reports'?reports():view==='birthdays'?head('Datas para lembrar','Pequenos gestos que aproximam. Próximos 7 dias.')+`<section class="card">${birthdayList()}<p class="note">Lembretes exibidos dentro do aplicativo.</p></section>`:view==='contracts'?contracts():settings())+'<div class="foot">OLHAN · FISIOTERAPIA DOMICILIAR ESPECIALIZADA · V13</div>';bindEvaluationForm()};
  render();
})();
</script>


<script>
/* ===== OLHAN V9 — CAMADA ONLINE / NEON ===== */
window.OLHAN_ONLINE_CONFIG = Object.freeze({
  project: 'Paula Olhan Fisioterapia',
  database: 'olhan',
  dataApi: 'https://ep-ancient-glade-b7ykjqko.apirest.c-13.us-east-1.aws.neon.tech/olhan/rest/v1',
  authBase: 'https://ep-ancient-glade-b7ykjqko.neonauth.c-13.us-east-1.aws.neon.tech/olhan/auth',
  schemaVersion: 1
});

window.olhanServer = {
  get token(){ return sessionStorage.getItem('olhan_auth_token') || ''; },
  setToken(token){ token ? sessionStorage.setItem('olhan_auth_token', token) : sessionStorage.removeItem('olhan_auth_token'); },
  async request(path, options={}){
    const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
    if(this.token) headers.Authorization='Bearer '+this.token;
    const r=await fetch(OLHAN_ONLINE_CONFIG.dataApi+'/'+path,{...options,headers});
    if(!r.ok) throw new Error('Servidor respondeu '+r.status);
    const text=await r.text();
    return text ? JSON.parse(text) : null;
  },
  async currentContract(type){
    const rows=await this.request(`contract_templates?contract_type=eq.${encodeURIComponent(type)}&is_current=eq.true&select=id,title,version,content&limit=1`);
    return rows && rows[0] ? rows[0] : null;
  },
  async ping(){
    try { await this.request('contract_templates?select=id&limit=1'); return true; }
    catch(e){ return false; }
  }
};

window.olhanOnlineStatus = async function(){
  const ok=await olhanServer.ping();
  modal('Servidor Olhan', `<div class="record"><h3>${ok?'Servidor conectado':'Autenticação necessária'}</h3><p>${ok?'O aplicativo conseguiu consultar o banco Neon.':'O backend já está configurado, mas o acesso aos dados clínicos exige uma sessão autenticada. Isso evita expor pacientes e prontuários publicamente.'}</p></div><div class="record"><h3>Estrutura online</h3><p>Pacientes · profissionais · agenda · evoluções · arquivos · modelos de contrato · contratos emitidos.</p></div><p class="note">Projeto: Paula Olhan Fisioterapia · banco: olhan · V9</p>`, ()=>{}, 'Fechar');
};

window.loadCurrentContractFromServer = async function(type='patient'){
  try{
    const tpl=await olhanServer.currentContract(type);
    if(!tpl) return toast('Ainda não existe um modelo atual desse contrato no servidor.');
    const f=document.getElementById('form');
    if(f && f.elements.body){ f.elements.body.value=tpl.content; toast(`Modelo ${tpl.title} v${tpl.version} carregado do servidor.`); }
    return tpl;
  }catch(e){ toast('Para buscar o contrato no servidor, entre com uma conta autorizada.'); return null; }
};

// Mantém o V8 funcionando localmente como contingência, mas deixa explícita a arquitetura de produção.
const _v9Settings = window.settings;
window.settings=function(){
  const html=_v9Settings();
  return html.replace('</main>', `<section class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Servidor Olhan</h2><p>Neon Auth + Neon Data API configurados para a versão online.</p></div><span class="tag">V13</span></div><div class="contract-actions"><button class="btn secondary small" onclick="olhanOnlineStatus()">Verificar servidor</button></div><p class="note">Dados clínicos não são liberados sem autenticação. Fotos e vídeos deverão permanecer em armazenamento privado, com acesso temporário para usuários autorizados.</p></section></main>`);
};

const _v9Render = window.render;
window.render=function(){
  _v9Render();
  const foot=document.querySelector('.footer-note,.v8-footer');
  if(foot) foot.textContent='Olhan App V13 · Vercel + Neon · contratos versionados';
};
try{ render(); }catch(e){}
</script>

<script id="olhan-v11-online-contracts">
(function(){
  async function api(body){
    const r=await fetch('/api/contracts',{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'Falha ao acessar modelos'); return j;
  }
  window.openOnlineTemplates=async function(){
    try{
      const {templates}=await api();
      const current=templates.filter(t=>t.is_current);
      modal('Modelos de contrato no servidor',`<p class="note">Ao salvar uma alteração, o sistema cria uma <b>nova versão</b>. Contratos já emitidos mantêm o texto anterior.</p>${current.map(t=>`<section class="card" style="margin:12px 0"><h3>${esc(t.title)}</h3><p>${t.template_key==='patient_service'?'Paciente':t.template_key==='team_service'?'Equipe / prestação de serviço':t.template_key==='team_ip'?'Equipe / propriedade intelectual':(t.contract_type==='patient'?'Paciente':'Equipe')} · versão ${t.version}</p><button class="btn secondary small" onclick="editOnlineTemplate(${t.id})">Editar e criar nova versão</button></section>`).join('')||'<div class="empty">Nenhum modelo vigente.</div>'}`,()=>{},'Fechar');
    }catch(e){toast('Não foi possível acessar os modelos online: '+e.message)}
  };
  window.editOnlineTemplate=async function(id){
    try{
      const {templates}=await api(); const t=templates.find(x=>Number(x.id)===Number(id)); if(!t)return;
      modal('Nova versão do modelo',`<div class="contract-editor"><div class="formgrid">${field('title','Título',t.title,'text','required')}</div><label class="wide">Texto do modelo<textarea name="content" required>${esc(t.content)}</textarea></label><p class="note">O texto atual continuará preservado como versão ${t.version}. O salvamento abaixo cria a próxima versão.</p></div>`,async data=>{
        try{const out=await api({action:'new-version',template_key:t.template_key,contract_type:t.contract_type,title:data.title,content:data.content});toast('Modelo salvo como versão '+out.template.version+'.');render()}catch(e){toast('Erro ao salvar: '+e.message)}
      },'Criar nova versão');
    }catch(e){toast('Erro: '+e.message)}
  };
  window.newContractFromOnlineTemplate=async function(){
    try{
      const {templates}=await api(); const t=templates.find(x=>x.template_key==='patient_service'&&x.is_current); if(!t)return toast('Não há modelo de paciente vigente no servidor.');
      const p=db.patients[0]; if(!p)return toast('Cadastre um paciente primeiro.');
      const c={id:id(),patient:p.id,patientName:p.name,patientCpf:p.cpf||'',clientName:p.responsible||p.name,clientCpf:p.responsible?(p.responsibleCpf||''):(p.cpf||''),clientAddress:p.address||'',sessionValue:Number(p.price||0),body:t.content,templateId:t.id,templateVersion:t.version,status:'Rascunho',created:new Date().toISOString(),updated:new Date().toISOString()};
      db.contracts.push(c);save();contractForm(c.id);
    }catch(e){toast('Erro: '+e.message)}
  };
  window.newContractFromOnlineTemplateKey=async function(templateKey){
    try{
      const {templates}=await api(); const t=templates.find(x=>x.template_key===templateKey&&x.is_current); if(!t)return toast('Não há modelo vigente no servidor.');
      if(templateKey==='patient_service') return newContractFromOnlineTemplate();
      const member=(db.team||[])[0]; if(!member)return toast('Cadastre um profissional da equipe primeiro.');
      const c={id:id(),patient:null,patientName:'',clientName:member.name||'',clientCpf:member.cpf||'',clientAddress:member.address||'',body:t.content,templateId:t.id,templateKey:t.template_key,templateVersion:t.version,contractType:t.contract_type,status:'Rascunho',created:new Date().toISOString(),updated:new Date().toISOString()};
      db.contracts.push(c);save();contractForm(c.id);
    }catch(e){toast('Erro: '+e.message)}
  };
  window.chooseOnlineContractTemplate=async function(){
    try{
      const {templates}=await api(); const current=templates.filter(t=>t.is_current);
      const label=k=>k==='patient_service'?'Paciente':k==='team_service'?'Equipe — prestação de serviço':k==='team_ip'?'Equipe — propriedade intelectual':k;
      modal('Novo contrato pelo modelo online',current.map(t=>`<section class="card" style="margin:10px 0"><h3>${esc(label(t.template_key))}</h3><p>${esc(t.title)} · versão ${t.version}</p><button class="btn small" onclick="closeModal();newContractFromOnlineTemplateKey('${t.template_key}')">Usar este modelo</button></section>`).join('')||'<div class="empty">Nenhum modelo vigente.</div>',()=>{},'Fechar');
    }catch(e){toast('Erro: '+e.message)}
  };
  const oldContracts=window.contracts;
  window.contracts=function(){
    let html=oldContracts();
    const marker='<div class="toolbar">';
    html=html.replace(marker,`<div class="v6-contract-template-bar"><div><b>Modelos online</b><small>Versionados no Neon. Alterações valem para novos contratos; os anteriores permanecem preservados.</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary small" onclick="openOnlineTemplates()">Editar modelos</button><button class="btn small" onclick="chooseOnlineContractTemplate()">Novo pelo modelo online</button></div></div>${marker}`);
    return html;
  };
})();
</script>
